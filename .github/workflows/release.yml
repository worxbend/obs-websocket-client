# Tag vX.Y.Z -> full Validate on that commit -> signed Maven Central publish -> verify -> GitHub Release.
# Secrets: MILL_SONATYPE_USERNAME, MILL_SONATYPE_PASSWORD (Central Portal token), MILL_PGP_SECRET_BASE64,
# MILL_PGP_PASSPHRASE. Variable: SCHEMA_LICENSE_REVIEWED. See docs/releases.md.
name: Release to Maven Central
on:
  push:
    tags: ["v*"]
  # Rerun: dispatch with a tag selected. Branches fail the first job.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: central-${{ github.ref }}
  cancel-in-progress: false
jobs:
  tag:
    name: Require a release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: test "$GITHUB_REF_TYPE" = tag
  validate:
    needs: tag
    uses: ./.github/workflows/validate.yml
    # Validate declares a main-only Pages job; callers must grant its permissions even though it is skipped.
    permissions:
      contents: read
      pages: write
      id-token: write
  publish:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate.outputs.validated-sha }}
          persist-credentials: false
      - name: Checkout is the validated tag commit
        env:
          VALIDATED_SHA: ${{ needs.validate.outputs.validated-sha }}
        run: |
          actual=$(git rev-parse HEAD)
          test -n "$VALIDATED_SHA"
          test "$actual" = "$VALIDATED_SHA"
          test "$actual" = "$GITHUB_SHA"
          git fetch --no-tags origin "+$GITHUB_REF:$GITHUB_REF"
          printf 'OBS_RELEASE_VERSION=%s\n' "${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Publishing credentials and license review are present
        env:
          MILL_SONATYPE_USERNAME: ${{ secrets.MILL_SONATYPE_USERNAME }}
          MILL_SONATYPE_PASSWORD: ${{ secrets.MILL_SONATYPE_PASSWORD }}
          MILL_PGP_SECRET_BASE64: ${{ secrets.MILL_PGP_SECRET_BASE64 }}
          SCHEMA_LICENSE_REVIEWED: ${{ vars.SCHEMA_LICENSE_REVIEWED }}
        run: |
          missing=""
          for variable in MILL_SONATYPE_USERNAME MILL_SONATYPE_PASSWORD MILL_PGP_SECRET_BASE64; do
            [ -n "${!variable}" ] || missing="$missing $variable"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing publishing secrets:$missing. Set them, then rerun (docs/releases.md)."
            exit 1
          fi
          revision=$(python3 -c 'import json; print(json.load(open("protocol-spec/provenance.json"))["revision"])')
          if [ "$SCHEMA_LICENSE_REVIEWED" != "$revision" ]; then
            echo "::error::Repository variable SCHEMA_LICENSE_REVIEWED must equal schema revision $revision after licence review (docs/releases.md)."
            exit 1
          fi
      - name: Provision pinned codegen Python
        id: python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version
      - name: Select provisioned interpreter
        run: printf '%s\n' 'OBS_CODEGEN_PYTHON=${{ steps.python.outputs.python-path }}' >> "$GITHUB_ENV"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25.0.3
      - name: Tag, changelog and all seven publish versions agree
        run: python3 tools/validate_release.py
      # One bundle = one Central deployment: all seven release or none (was one deployment per module).
      - name: Publish signed libraries to Maven Central
        timeout-minutes: 30
        env:
          MILL_SONATYPE_USERNAME: ${{ secrets.MILL_SONATYPE_USERNAME }}
          MILL_SONATYPE_PASSWORD: ${{ secrets.MILL_SONATYPE_PASSWORD }}
          MILL_PGP_SECRET_BASE64: ${{ secrets.MILL_PGP_SECRET_BASE64 }}
          MILL_PGP_PASSPHRASE: ${{ secrets.MILL_PGP_PASSPHRASE }}
        run: >-
          ./mill --no-server mill.javalib.SonatypeCentralPublishModule/
          --publishArtifacts '{protocol,core,sttp,okhttp,zio,fs2,pekko}.publishArtifacts'
          --bundleName "obs-websocket-client-$OBS_RELEASE_VERSION"
          --shouldRelease true --awaitTimeout 1200000
      - name: Verify all 28 public Central files against built artifacts
        timeout-minutes: 35
        run: python3 tools/verify_published.py https://repo.maven.apache.org/maven2
      - name: Attest the verified release jars
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            out/protocol/*jar.dest/out.jar
            out/core/*jar.dest/out.jar
            out/sttp/*jar.dest/out.jar
            out/okhttp/*jar.dest/out.jar
            out/zio/*jar.dest/out.jar
            out/fs2/*jar.dest/out.jar
            out/pekko/*jar.dest/out.jar
      - name: Isolated consumer resolves every artifact from Central
        timeout-minutes: 20
        run: tools/consumer_smoke.sh "$OBS_RELEASE_VERSION" https://repo.maven.apache.org/maven2
  release:
    name: Announce verified Central release
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release for the tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
