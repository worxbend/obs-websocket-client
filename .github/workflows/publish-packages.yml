# Tag vX.Y.Z -> full Validate on that commit -> publish to GitHub Packages -> verify -> consumer.
# Independent of Central: uses the job GITHUB_TOKEN only. See docs/releases.md.
name: Publish GitHub Packages
on:
  push:
    tags: ["v*"]
  # Rerun: dispatch with a tag selected. Branches fail the first job.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-packages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  tag:
    name: Require a release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: test "$GITHUB_REF_TYPE" = tag
  validate:
    needs: tag
    uses: ./.github/workflows/validate.yml
    # Validate declares a main-only Pages job; callers must grant its permissions even though it is skipped.
    permissions:
      contents: read
      pages: write
      id-token: write
  publish:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      PACKAGES_REPO: https://maven.pkg.github.com/${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate.outputs.validated-sha }}
          persist-credentials: false
      - name: Checkout is the validated tag commit
        env:
          VALIDATED_SHA: ${{ needs.validate.outputs.validated-sha }}
        run: |
          actual=$(git rev-parse HEAD)
          test -n "$VALIDATED_SHA"
          test "$actual" = "$VALIDATED_SHA"
          test "$actual" = "$GITHUB_SHA"
          git fetch --no-tags origin "+$GITHUB_REF:$GITHUB_REF"
          printf 'OBS_RELEASE_VERSION=%s\n' "${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Provision pinned codegen Python
        id: python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version
      - name: Select provisioned interpreter
        run: printf '%s\n' 'OBS_CODEGEN_PYTHON=${{ steps.python.outputs.python-path }}' >> "$GITHUB_ENV"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25.0.3
      - name: Tag, changelog and all seven publish versions agree
        run: python3 tools/validate_release.py
      - name: Publish all seven libraries to GitHub Packages
        timeout-minutes: 25
        env:
          MILL_MAVEN_USERNAME: ${{ github.actor }}
          MILL_MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          ./mill --no-server mill.javalib.MavenPublishModule/
          --publishArtifacts '{protocol,core,sttp,okhttp,zio,fs2,pekko}.publishArtifacts'
          --releaseUri "$PACKAGES_REPO" --snapshotUri "$PACKAGES_REPO"
      - name: Verify all 28 GitHub Packages files against built artifacts
        timeout-minutes: 10
        env:
          GITHUB_PACKAGES_USERNAME: ${{ github.actor }}
          GITHUB_PACKAGES_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/verify_published.py "$PACKAGES_REPO"
      - name: Isolated consumer resolves every artifact from GitHub Packages
        timeout-minutes: 20
        env:
          COURSIER_CREDENTIALS: maven.pkg.github.com ${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}
        run: tools/consumer_smoke.sh "$OBS_RELEASE_VERSION" "$PACKAGES_REPO"
