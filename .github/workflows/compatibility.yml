name: Desktop JVM compatibility
on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: compatibility-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Provision pinned codegen Python
        id: python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version
      - name: Select provisioned interpreter
        shell: bash
        run: printf '%s\n' 'OBS_CODEGEN_PYTHON=${{ steps.python.outputs.python-path }}' >> "$GITHUB_ENV"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 25.0.3
      - name: Restore Coursier artifacts
        id: cache-coursier
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/coursier
            ~\AppData\Local\Coursier\cache
          key: ${{ runner.os }}-coursier-${{ hashFiles('build.mill', '.mill-version') }}
          restore-keys: |
            ${{ runner.os }}-coursier-
      - name: Save Coursier artifacts
        # Only trusted main builds may write the shared cache; other triggers restore read-only.
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.cache-coursier.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/coursier
            ~\AppData\Local\Coursier\cache
          key: ${{ runner.os }}-coursier-${{ hashFiles('build.mill', '.mill-version') }}
      - name: Unix Python codegen tests and tools
        if: runner.os != 'Windows'
        run: |
          ./mill --no-server codegen.test
          ./mill --no-server 'codegen.test.{lint,formatCheck,typeCheck}'
          python3 tools/check_generation.py
      - name: Windows Python codegen tests and tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\mill.bat --no-server codegen.test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\mill.bat --no-server 'codegen.test.{lint,formatCheck,typeCheck}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/check_generation.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Unix socket and lifecycle tests
        if: runner.os != 'Windows'
        run: ./mill --no-server '{protocol,core,sttp,okhttp,zio,fs2,pekko}.test'
      - name: Windows socket and lifecycle tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\mill.bat --no-server '{protocol,core,sttp,okhttp,zio,fs2,pekko}.test'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: desktop-${{ matrix.os }}
          path: out/*/test/testForked.dest/
          if-no-files-found: error
