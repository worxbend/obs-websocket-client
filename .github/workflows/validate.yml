name: Validate
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Provision pinned codegen Python
        id: python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version
      - name: Select provisioned interpreter
        shell: bash
        run: printf '%s\n' 'OBS_CODEGEN_PYTHON=${{ steps.python.outputs.python-path }}' >> "$GITHUB_ENV"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 25.0.3
      - name: Restore Mill build outputs and Coursier artifacts
        id: cache-mill
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/coursier
            out/
          key: ${{ runner.os }}-${{ runner.arch }}-mill-python-${{ hashFiles('build.mill', '.mill-version', '.python-version', 'codegen/requirements*.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-mill-python-
      - name: Save Mill build outputs and Coursier artifacts
        # Only trusted main builds may write the shared cache; pull requests restore read-only.
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.cache-mill.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/coursier
            out/
          key: ${{ runner.os }}-${{ runner.arch }}-mill-python-${{ hashFiles('build.mill', '.mill-version', '.python-version', 'codegen/requirements*.lock') }}
      - name: Compile all production modules
        run: ./mill --no-server '{protocol,core,sttp,okhttp,zio,fs2,pekko,examples,server}.compile'
      - name: Built-in Scalafix rules
        run: ./mill --no-server sourceStyle.fix --check
      - name: Formatting
        run: |
          ./mill --no-server mill.scalalib.scalafmt.ScalafmtModule/scalafmt --test build.mill
          ./mill --no-server '{protocol,core,sttp,okhttp,zio,fs2,pekko,examples,server,bench}.checkFormat'
          ./mill --no-server '{protocol,core,sttp,okhttp,zio,fs2,pekko,examples,server,integration}.test.checkFormat'
      - name: Python codegen lint, formatting and strict types
        run: ./mill --no-server 'codegen.test.{lint,formatCheck,typeCheck}'
      - name: Coverage verifier fault tests
        run: python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Fresh tests and exact coverage gate
        run: tools/coverage.sh
      - name: Offline regeneration consistency
        run: python3 tools/check_generation.py
      - name: Resolved dependency baseline
        run: python3 tools/check_dependencies.py
      - name: Documentation and isolated local consumer
        run: tools/consumer_smoke.sh
      - name: Documentation and repository base path checks
        run: |
          ./mill --no-server integration.test.compile
          ./mill --no-server site.build
      - name: Verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-evidence
          path: |
            out/*/scoverage/xmlReport.dest/
            out/*/scoverage/htmlReport.dest/
            out/*/test/testForked.dest/
            out/codegen/test/coverage.dest/
            out/coverage-run.json
          if-no-files-found: error
      - name: Upload documentation preview
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: documentation-preview
          path: out/site
      - name: Upload Pages artifact from validated main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: out/site
  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy tested documentation
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
