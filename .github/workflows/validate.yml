name: Validate
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 25.0.3
      - name: Cache Mill build outputs and Coursier artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/coursier
            out/
          key: ${{ runner.os }}-mill-${{ hashFiles('build.mill', '.mill-version') }}
          restore-keys: |
            ${{ runner.os }}-mill-
      - name: Compile all production modules
        run: ./mill --no-server '{codegen,protocol,core,sttp,examples,server}.compile'
      - name: Formatting
        run: |
          ./mill --no-server '{codegen,protocol,core,sttp,examples,server}.checkFormat'
          ./mill --no-server '{codegen,protocol,core,sttp,examples,server,integration}.test.checkFormat'
      - name: Coverage verifier fault tests
        run: python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Fresh tests and exact coverage gate
        run: tools/coverage.sh
      - name: Offline regeneration consistency
        run: python3 tools/check_generation.py
      - name: Source, API docs, and local consumer
        run: |
          ./mill --no-server '{protocol,core,sttp}.publishLocal'
          tools/consumer_smoke.sh
      - name: Documentation and repository base path checks
        run: |
          ./mill --no-server integration.test.compile
          ./mill --no-server site.build
      - name: Verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-evidence
          path: |
            out/*/scoverage/xmlReport.dest/
            out/*/scoverage/htmlReport.dest/
            out/*/test/testForked.dest/
            out/coverage-run.json
          if-no-files-found: error
      - name: Upload documentation preview
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: documentation-preview
          path: out/site
      - name: Upload Pages artifact from validated main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: out/site
  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy tested documentation
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
