name: Disposable real OBS
on:
  workflow_dispatch:
  schedule:
    - cron: '43 5 * * 1'
permissions:
  contents: read
concurrency:
  group: real-obs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  isolated-obs:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Provision pinned codegen Python
        id: python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version
      - name: Select provisioned interpreter
        shell: bash
        run: printf '%s\n' 'OBS_CODEGEN_PYTHON=${{ steps.python.outputs.python-path }}' >> "$GITHUB_ENV"
      - name: Authenticated OBS scene, event and restart smoke
        run: tools/real_obs_smoke.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: real-obs-evidence-${{ github.sha }}
          path: |
            out/real-obs-smoke/
            out/integration/test/testForked.dest/
          if-no-files-found: error
