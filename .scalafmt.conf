# Shared Scala 3 style. See docs/contributing.md for the reference configs and choices.
version = 3.11.5
runner.dialect = scala3
maxColumn = 120
lineEndings = unix

# Two-space blocks and continuations keep indentation predictable in Scala 3.
indent.main = 2
indent.callSite = 2
indent.defnSite = 2
newlines.source = keep
newlines.alwaysBeforeMultilineDef = false
danglingParentheses.preset = true
binPack.callSite = never
binPack.defnSite = never

# Vertical alignment for definitions, case arrows, generators, and named arguments.
# Keep multiline bodies at their structural indent and respect the line-length limit.
align.preset = most
align.multiline = false
align.allowOverflow = false
align.openParenCallSite = false
align.openParenDefnSite = false
align.tokens."+" = [
  { code = "=", owners = [{ regex = "Enumerator\\.Val|Defn\\.(Val|Var|GivenAlias|Def|Type)|Term\\.Assign" }] },
  { code = ":", owners = [{ regex = "Term\\.Param", parents = ["Ctor\\.Primary", "Defn\\.Def"] }] }
]

# Source templates use the standard stripMargin; only whitespace before the margin may move.
assumeStandardLibraryStripMargin = true
align.stripMargin = true

# Scala 3 syntax; no automatic end-marker insertion or Scala 2 dialect overrides.
rewrite.scala3.convertToNewSyntax = true
rewrite.scala3.removeOptionalBraces = true
rewrite.rules = [SortModifiers, Imports]
rewrite.imports.expand = false
rewrite.imports.sort = scalastyle
rewrite.trailingCommas.style = multiple

# Keep prose wrapping intentional while presenting Scaladoc consistently.
docstrings.style = SpaceAsterisk
docstrings.wrap = keep

# These are generated artifacts, independent golden fixtures, upstream snapshots,
# or the deliberately frozen pre-optimization benchmark—not handwritten formatting inputs.
project.excludePaths = [
  "glob:**/out/**",
  "glob:**/skills/**",
  "glob:**/codegen/test/resources/golden/**",
  "glob:**/namedArgumentRules/test/resources/**",
  "glob:**/bench/src/**/LegacyJsonValue.scala"
]

# Formatting cannot infer parameter names. Semantic enforcement is the separate CI check:
# ./mill sourceStyle.namedArguments --check
