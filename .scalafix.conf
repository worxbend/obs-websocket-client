# Built-in syntactic rules only; compatible with this project's Scala 3 direct style.
rules = [RedundantSyntax, DisableSyntax]

DisableSyntax {
  noXml = true
  noFinalize = true
}

# Import ordering belongs to Scalafmt; unused-code checks belong to the compiler.
# Named arguments remain a review convention: there is no built-in enforcement rule.
